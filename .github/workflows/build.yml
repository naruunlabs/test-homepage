name: 홈페이지 자동 갱신

on:
  push:
    branches: [main]
    paths:
      - 'config.js'
      - 'images/**'
      - 'scripts/**'
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install --quiet Pillow

      - name: 네이버 블로그 가져오기
        run: python scripts/sync_blog.py
        continue-on-error: true

      - name: 홈페이지 생성
        run: python scripts/build.py

      - name: 변경사항 반영
        run: |
          git config user.name  "site-bot"
          git config user.email "actions@github.com"
          git add -A index.html sitemap.xml robots.txt images scripts/blog_data.json
          if git diff --staged --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "chore: 홈페이지 자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
